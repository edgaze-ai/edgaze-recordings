<!doctype html>
<html lang="en" class="ed">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Edgaze Animator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/stage.css" />
    <link rel="stylesheet" href="./styles/dashboard.css" />
  </head>
  <body class="dash">
    <header class="top">
      <div class="dash-brand">
        <span class="dash-mark" aria-hidden="true"></span>
        <h1>Edgaze Animator</h1>
      </div>
      <dl id="summary" class="stats" aria-label="Workspace"></dl>
    </header>

    <main class="layout">
      <section class="panel scenes-panel" aria-labelledby="scenes-label">
        <div class="panel-head">
          <h2 id="scenes-label">Scenes</h2>
          <div class="tools">
            <label class="search">
              <span class="visually-hidden">Filter scenes</span>
              <span id="search-icon" aria-hidden="true"></span>
              <input id="search" type="search" placeholder="Filter scenes" autocomplete="off" />
              <kbd>/</kbd>
            </label>
            <div class="seg" role="group" aria-label="Frame">
              <button type="button" data-frame="all" aria-pressed="true">All</button>
              <button type="button" data-frame="wide" aria-pressed="false">16:9</button>
              <button type="button" data-frame="tall" aria-pressed="false">9:16</button>
            </div>
          </div>
        </div>
        <ul id="scenes" class="scene-list" role="listbox" aria-label="Scenes"></ul>
      </section>

      <aside class="side">
        <section id="review" class="panel review" aria-labelledby="review-label">
          <div class="panel-head">
            <h2 id="review-label">Latest export</h2>
            <span id="review-scope" class="quiet"></span>
          </div>
          <button
            type="button"
            id="review-stage"
            class="review-stage"
            aria-label="Play latest export"
          >
            <video id="review-film" muted playsinline preload="metadata"></video>
            <span id="review-empty" class="review-empty">No export yet</span>
            <span class="review-play" aria-hidden="true"></span>
          </button>
          <div class="review-meta">
            <p id="review-name"></p>
            <p id="review-info" class="quiet"></p>
          </div>
        </section>

        <section class="panel clips-panel" aria-labelledby="clips-label">
          <div class="panel-head">
            <h2 id="clips-label">Recordings</h2>
            <button type="button" id="clip-filter" class="link" hidden>Show all</button>
          </div>
          <ul id="clips" class="clip-list"></ul>
        </section>
      </aside>
    </main>

    <details class="panel assets-panel">
      <summary>
        <h2>Assets</h2>
        <span id="assets-count" class="quiet"></span>
      </summary>
      <ul id="assets" class="asset-grid"></ul>
      <p class="quiet note">
        Drop plates in src/assets/photos, videos or gifs. Recordings write to recordings/ and
        stay out of git.
      </p>
    </details>

    <div id="xfer" class="xfer" hidden>
      <div class="xfer-meta">
        <span id="xfer-label"></span>
        <span id="xfer-pct" class="xfer-pct"></span>
      </div>
      <div class="xfer-rail"><i id="xfer-fill"></i></div>
    </div>
    <p id="status" class="toast" role="status"></p>

    <div id="viewer" hidden>
      <div class="viewer-box">
        <div id="viewer-bar">
          <p id="viewer-name"></p>
          <button type="button" id="viewer-close" aria-label="Close viewer"></button>
        </div>
        <video id="player" controls playsinline></video>
      </div>
    </div>

    <script type="module" src="./dashboard.ts"></script>
  </body>
</html>
