<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>001 — Run lifecycle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/stage.css" />
  </head>
  <body>
    <div class="stage" data-scene="001">
      <div class="bloom c"></div>
      <div class="bloom p"></div>
      <div class="camera">
        <div class="frame">
          <div class="copy">
            <p class="eyebrow" data-split>Run lifecycle</p>
            <h1>
              <span data-split>Every run has</span>
              <br />
              <span class="grad" data-split="whole">one arc.</span>
            </h1>
            <div class="rule"></div>
            <div class="stats">
              <div class="stat">
                <b id="c1">0</b>
                <span>p50 settle</span>
              </div>
              <div class="stat">
                <b id="c2">0</b>
                <span>runs / min</span>
              </div>
            </div>
            <p class="foot" data-split>Trigger · execute · settle</p>
          </div>
          <div class="graph">
            <svg viewBox="0 0 640 820" fill="none" aria-hidden="true">
              <defs>
                <linearGradient
                  id="wire-grad"
                  x1="200"
                  y1="70"
                  x2="200"
                  y2="750"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0%" class="stop-cyan" />
                  <stop offset="100%" class="stop-pink" />
                </linearGradient>
              </defs>
              <path
                id="wire"
                class="wire"
                d="M 200 70 C 200 180, 480 240, 480 400 C 480 560, 200 620, 200 750"
              />
            </svg>
            <div class="trail-host"></div>
            <div class="nodes">
              <div class="node" data-node="trigger" data-tone="cyan">
                <i class="glow"></i>
                <b></b>
                <span>Trigger</span>
              </div>
              <div class="node" data-node="execute" data-tone="cyan">
                <i class="glow"></i>
                <b></b>
                <span>Execute</span>
              </div>
              <div class="node" data-node="settle" data-tone="pink">
                <i class="glow"></i>
                <b></b>
                <span>Settle</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="grain"></div>
    </div>
    <div class="chrome">
      <button id="replay" type="button">Replay</button>
      <button id="slow" type="button">0.25×</button>
      <button id="rec" type="button">Record</button>
    </div>
    <script type="module" src="./scene.ts"></script>
  </body>
</html>
