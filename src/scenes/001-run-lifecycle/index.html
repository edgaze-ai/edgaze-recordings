<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3f3f0" />
    <title>001 — Run lifecycle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/stage.css" />
  </head>
  <body>
    <div class="stage" data-scene="001">
      <div class="camera">
        <div class="screen" data-screen="title">
          <h1 class="grad" data-split="whole">Every run has one arc.</h1>
        </div>
        <div class="screen" data-screen="graph">
          <div class="graph">
            <svg viewBox="0 0 640 820" fill="none" aria-hidden="true">
              <defs>
                <linearGradient
                  id="wire-grad"
                  x1="200"
                  y1="70"
                  x2="200"
                  y2="750"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0%" class="stop-cyan" />
                  <stop offset="100%" class="stop-pink" />
                </linearGradient>
              </defs>
              <path
                id="wire"
                class="wire"
                d="M 200 70 C 200 180, 480 240, 480 400 C 480 560, 200 620, 200 750"
              />
            </svg>
            <div class="trail-host"></div>
            <div class="nodes">
              <div class="node" data-node="trigger" data-tone="cyan">
                <i class="glow"></i>
                <b></b>
              </div>
              <div class="node" data-node="execute" data-tone="cyan">
                <i class="glow"></i>
                <b></b>
              </div>
              <div class="node" data-node="settle" data-tone="pink">
                <i class="glow"></i>
                <b></b>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="grain"></div>
    </div>
    <div class="chrome">
      <a href="/">Clips</a>
      <button id="replay" type="button">Replay</button>
      <button id="slow" type="button">0.25×</button>
      <button id="rec" type="button">Record</button>
      <button id="export-mp4" type="button">MP4</button>
      <button id="export-mov" type="button">MOV</button>
      <span id="status" class="status"></span>
    </div>
    <script type="module" src="./scene.ts"></script>
  </body>
</html>
