<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3f3f0" />
    <title>Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/stage.css" />
  </head>
  <body>
    <div class="stage">
      <div class="camera">
        <div class="screen" data-screen="title">
          <h1 class="grad" data-split="whole">Write the beat.</h1>
        </div>
      </div>
      <div class="grain"></div>
    </div>
    <div class="chrome">
      <a href="/">Clips</a>
      <button id="replay" type="button">Replay</button>
      <button id="slow" type="button">0.25×</button>
      <button id="rec" type="button">Record</button>
      <button id="export-mp4" type="button">MP4</button>
      <button id="export-mov" type="button">MOV</button>
      <span id="status" class="status"></span>
    </div>
    <script type="module" src="./scene.ts"></script>
  </body>
</html>
